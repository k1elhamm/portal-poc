services:
  portal-three:
    image: portal-three-poc:0.1.0
    build:
      context: .
      args:
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
    ports:
      - "${PORTAL_BIND_ADDRESS:-127.0.0.1}:${PORTAL_HTTP_PORT:-4334}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
