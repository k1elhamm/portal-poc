<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal — Catalogue d’API · Groupe BPCE</title>
  <style>
    :root {
      --bg: #f5f3ee; --panel: #ffffff; --panel-2: #efebe3; --ink: #1b1e25; --ink-2: #444a56; --muted: #7b818d; --rule: #e1dccf;
      --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
      --ok: #2f9e44; --ease: cubic-bezier(.2, .8, .2, 1);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; -webkit-font-smoothing: antialiased; }
    button, input, textarea { font: inherit; color: inherit; }
    .app { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto 1fr; height: 100vh; }

    /* ---------- Barre haute ---------- */
    .topbar { display: grid; grid-template-columns: auto auto minmax(0, 1fr) minmax(220px, 380px); align-items: center; gap: 18px; padding: 12px 20px 8px; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-mark { display: grid; grid-template: 1fr 1fr / 1fr 1fr; gap: 2px; width: 30px; height: 30px; }=    .brand-mark i { border-radius: 3px; background: #e8590c; }
    .brand-mark i:nth-child(2) { background: #1c7ed6; } .brand-mark i:nth-child(3) { background: #7048e8; } .brand-mark i:nth-child(4) { background: #2f9e44; }
    .brand-name { font-weight: 850; letter-spacing: .04em; }
    .brand-sub { color: var(--muted); font-size: 12px; }
    .views { display: inline-flex; gap: 4px; padding: 4px; border-radius: 14px; background: var(--panel-2); }
    .views button { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border: 0; border-radius: 10px; background: transparent; color: var(--ink-2); cursor: pointer; font-weight: 700; transition: background .2s, color .2s, box-shadow .2s; }
    .views button svg { width: 18px; height: 18px; }
    .views button.on { background: var(--ink); color: #fff; box-shadow: 0 6px 16px rgb(0 0 0 / 15%); }
    .crumbs { display: flex; align-items: center; gap: 2px; min-width: 0; overflow: hidden; font-size: 13px; }
    .crumb { flex: 0 1 auto; min-width: 0; max-width: 260px; overflow: hidden; padding: 6px 10px; border: 0; border-radius: 999px; background: transparent; color: var(--muted); cursor: pointer; text-overflow: ellipsis; white-space: nowrap; }
    .crumb:hover { background: var(--panel-2); color: var(--ink); }
    .crumb.current { flex-shrink: 0; background: var(--ink); color: #fff; cursor: default; }
    .crumb-level { margin-right: 5px; font-size: 10px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; opacity: .6; }
    .crumb-sep { color: #b9b2a3; }
    .search { position: relative; }
    .search input { width: 100%; padding: 11px 60px 11px 38px; border: 1px solid var(--rule); border-radius: 999px; background: var(--panel); outline: none; transition: border-color .15s, box-shadow .15s; }
    .search input:focus { border-color: var(--ink-2); box-shadow: 0 0 0 4px rgb(27 30 37 / 8%); }
    .search > svg { position: absolute; top: 50%; left: 14px; width: 16px; height: 16px; color: var(--muted); transform: translateY(-50%); }
    .search kbd { position: absolute; top: 50%; right: 12px; padding: 2px 7px; border: 1px solid var(--rule); border-radius: 6px; color: var(--muted); font-family: var(--font); font-size: 11px; transform: translateY(-50%); }
    .results { position: absolute; top: calc(100% + 8px); right: 0; left: 0; z-index: 60; display: none; max-height: 70vh; overflow: auto; padding: 8px; border: 1px solid var(--rule); border-radius: 12px; background: var(--panel); box-shadow: 0 18px 50px rgb(27 30 37 / 18%); }
    .results.open { display: block; }
    .res-group { padding: 8px 10px 4px; color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    .res-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; border-radius: 8px; background: transparent; cursor: pointer; text-align: left; }
    .res-item:hover, .res-item.active { background: var(--panel-2); }
    .res-icon { display: grid; flex: none; width: 26px; height: 26px; place-items: center; border-radius: 7px; background: color-mix(in srgb, var(--c, #adb5bd) 18%, #fff); color: color-mix(in srgb, var(--c, #495057) 80%, #000); font-size: 11px; font-weight: 800; }
    .res-main { min-width: 0; }
    .res-title { overflow: hidden; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    .res-path { overflow: hidden; color: var(--muted); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    .res-empty { padding: 14px 10px; color: var(--muted); }

    /* ---------- Barre d'outils ---------- */
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 2px 20px 10px; }
    .summary { display: flex; flex: 1 1 auto; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; margin-right: auto; min-width: 0; }
    .toolbar > .tool-group { flex: none; }
    .summary h1 { margin: 0; font-size: 22px; font-weight: 820; letter-spacing: -.02em; }
    .facts { display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--muted); font-size: 13px; }
    .facts b { color: var(--ink); font-weight: 750; }
    .seg { display: inline-flex; padding: 3px; border: 1px solid var(--rule); border-radius: 999px; background: var(--panel); }
    .seg-label { margin-right: 6px; color: var(--muted); font-size: 11px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
    .seg button { padding: 6px 12px; border: 0; border-radius: 999px; background: transparent; color: var(--ink-2); cursor: pointer; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
    .seg button.on { background: var(--ink); color: #fff; }
    .seg button:disabled { opacity: .4; cursor: not-allowed; }
    .seg button small { margin-left: 4px; opacity: .6; font-size: 10px; }
    .tool-group { display: flex; align-items: center; }
    .pill { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border: 1px solid var(--rule); border-radius: 999px; background: var(--panel); cursor: pointer; font-size: 12.5px; font-weight: 650; white-space: nowrap; }
    .pill:hover { border-color: var(--ink-2); }
    .pill.on { border-color: var(--ink); background: var(--ink); color: #fff; }
    [hidden] { display: none !important; }

    /* ---------- Scène ---------- */
    .stage { position: relative; min-height: 0; margin: 0 20px 16px; overflow: hidden; border-radius: 20px; }
    .view { position: absolute; inset: 0; transition: opacity .4s var(--ease), transform .4s var(--ease), visibility 0s; }
    .view.off { visibility: hidden; opacity: 0; transform: scale(.97); pointer-events: none; transition: opacity .3s, transform .3s, visibility 0s .3s; }

    /* ---------- Mosaïque ---------- */
    .mosaic { position: absolute; inset: 0; overflow: hidden; }
    .layer { position: absolute; inset: 0; transform-origin: 0 0; }
    .layer.anim { transition: transform .5s var(--ease), opacity .5s var(--ease); }
    .layer.zooming .tile-head, .layer.zooming .inner-blk, .layer.zooming .mini { opacity: 0; transition: opacity .12s; }
    .layer.enter { opacity: 0; transform: scale(.985); }
    .tile { position: absolute; display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--rule); border-radius: 14px; background: var(--panel); cursor: zoom-in; transition: box-shadow .2s, border-color .2s, opacity .3s, filter .3s; }
    .tile.pole { border-color: color-mix(in srgb, var(--c) 35%, #fff); background: color-mix(in srgb, var(--c) 9%, #fff); }
    .tile:hover { border-color: color-mix(in srgb, var(--c, #868e96) 60%, #fff); box-shadow: 0 10px 28px rgb(27 30 37 / 10%); z-index: 2; }
    .tile.dim, .inner-blk.dim { opacity: .25; filter: saturate(.3); }
    .tile.match { box-shadow: 0 0 0 3px #ffd43b; }
    .tile-head { display: flex; align-items: flex-start; gap: 8px; padding: 9px 11px 5px; border: 0; background: transparent; text-align: left; cursor: zoom-in; transition: opacity .2s .1s; }
    .tile-head:focus-visible, .inner-blk:focus-visible { outline: 3px solid #1c7ed6; outline-offset: -3px; }
    .tile-name { overflow: hidden; font-size: 14px; font-weight: 780; letter-spacing: -.01em; line-height: 1.2; text-overflow: ellipsis; }
    .tile-meta { margin-top: 2px; color: var(--muted); font-size: 11.5px; line-height: 1.35; }
    .tile.pole .tile-meta { color: color-mix(in srgb, var(--c) 55%, #333); }
    .tile.compact .tile-head { padding: 6px 8px 3px; }
    .tile.compact .tile-name { overflow: hidden; font-size: 12.5px; text-overflow: ellipsis; white-space: nowrap; }
    .tile.compact .tile-meta { overflow: hidden; margin-top: 0; font-size: 10.5px; text-overflow: ellipsis; white-space: nowrap; }
    .tile.compact .tile-body { margin: 0 5px 5px; }
    .tile-head > span:first-child { min-width: 0; }
    .tile-badges { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px; margin-left: auto; }
    .badge { padding: 2px 7px; border-radius: 999px; background: #ffd43b; color: #5c4400; font-size: 11px; font-weight: 750; white-space: nowrap; }
    .step { display: inline-grid; flex: none; width: 20px; height: 20px; place-items: center; border-radius: 50%; background: var(--line-color); color: #fff; font-size: 11px; font-weight: 800; box-shadow: 0 0 0 2px #fff; }
    .tile-body { position: relative; flex: 1; margin: 0 7px 7px; }
    .inner-blk { position: absolute; overflow: hidden; padding: 4px 6px; border: 0; border-radius: 7px; background: color-mix(in srgb, var(--c) 22%, #fff); color: color-mix(in srgb, var(--c) 60%, #222); cursor: zoom-in; font-size: 10.5px; font-weight: 650; line-height: 1.2; text-align: left; transition: filter .15s, opacity .3s, box-shadow .2s; }
    .inner-blk:hover { filter: brightness(.96) saturate(1.3); }
    .inner-blk.match { box-shadow: inset 0 0 0 2px #f59f00; }
    .inner-blk .step { position: absolute; top: 3px; right: 3px; width: 16px; height: 16px; font-size: 9px; }
    .mini { position: absolute; right: 8px; bottom: 8px; left: 8px; display: flex; align-items: flex-end; gap: 2px; height: calc(100% - 16px); pointer-events: none; transition: opacity .2s .1s; }
    .mini i { flex: none; border-radius: 2px 2px 1px 1px; background: color-mix(in srgb, var(--c) var(--k), #fff); }
    .mini::after { content: ""; position: absolute; right: -4px; bottom: -4px; left: -4px; height: 3px; border-radius: 2px; background: color-mix(in srgb, var(--c) 35%, #b9a98d); }
    .links { position: absolute; inset: 0; z-index: 4; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
    .link { fill: none; stroke-linecap: round; stroke-dasharray: 7 6; animation: flow 1s linear infinite; opacity: .9; }
    .link.dep { stroke: #1c7ed6; } .link.use { stroke: #e8590c; } .link.evt { stroke: #9c36b5; stroke-dasharray: 2 6; }
    @keyframes flow { to { stroke-dashoffset: -26; } }
    .rel-focus { box-shadow: 0 0 0 3px var(--ink) !important; opacity: 1 !important; filter: none !important; }
    .rel-dep { box-shadow: 0 0 0 3px #1c7ed6 !important; opacity: 1 !important; filter: none !important; }
    .rel-use { box-shadow: 0 0 0 3px #e8590c !important; opacity: 1 !important; filter: none !important; }
    .rel-evt { box-shadow: 0 0 0 3px #9c36b5 !important; opacity: 1 !important; filter: none !important; }

    .frame { position: absolute; overflow: hidden; border: 1.5px dashed #c9c1b0; border-radius: 10px; background: rgb(255 255 255 / 55%); transition: opacity .3s, box-shadow .2s; }
    .frame.dim { opacity: .3; }
    .frame-label { position: absolute; top: 0; right: 0; left: 0; height: 18px; overflow: hidden; padding: 3px 7px; border: 0; background: none; color: var(--muted); cursor: zoom-in; font-size: 9.5px; font-weight: 800; letter-spacing: .07em; text-align: left; text-overflow: ellipsis; text-transform: uppercase; white-space: nowrap; }
    .frame-label:hover { color: var(--ink); }
    .frame-inner { position: absolute; top: 18px; right: 3px; bottom: 3px; left: 3px; }
    .inner-blk .nm { position: relative; z-index: 1; display: -webkit-box; overflow: hidden; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .inner-blk .cnt { position: relative; z-index: 1; display: block; margin-top: 1px; font-size: 9.5px; font-weight: 600; opacity: .75; }
    .sec-nav { display: flex; flex-wrap: wrap; gap: 4px; margin: 12px 0 2px; }
    .sec-nav button { padding: 4px 9px; border: 1px solid var(--rule); border-radius: 999px; background: #fff; cursor: pointer; font-size: 11.5px; font-weight: 700; }
    .sec-nav button:hover { border-color: var(--ink-2); }
    /* ---------- Bibliothèque (rayon d'une application) ---------- */
    .shelf-host { position: absolute; inset: 0; }
    .shelf { position: absolute; inset: 0; display: flex; flex-direction: column; background: linear-gradient(180deg, #fbf9f4, #f0ebe0); }
    .shelf-head { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 18px; padding: 16px 20px 6px; }
    .shelf-kicker { color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    .shelf-kicker button { padding: 0; border: 0; background: none; color: inherit; cursor: pointer; font: inherit; letter-spacing: inherit; text-decoration: underline; text-decoration-color: var(--rule); text-transform: inherit; }
    .dom-dot { display: inline-block; width: 9px; height: 9px; margin: 0 5px 0 2px; border-radius: 50%; background: var(--c); vertical-align: 0; }
    .shelf-title { margin: 3px 0 2px; font-size: 24px; font-weight: 820; letter-spacing: -.02em; }
    .shelf-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-left: auto; }
    .shelf-filter { width: 190px; padding: 7px 12px; border: 1px solid var(--rule); border-radius: 999px; background: #fff; font-size: 12.5px; outline: none; }
    .shelf-filter:focus { border-color: var(--ink-2); }
    .shelf-legend { padding: 0 20px 4px; color: var(--muted); font-size: 11.5px; }
    .shelf-legend i { display: inline-block; width: 10px; height: 4px; margin: 0 3px 1px 6px; border-radius: 2px; vertical-align: middle; }
    .shelf-body { flex: 1; overflow: auto; padding: 4px 20px 30px; }
    .plank-row { position: relative; display: flex; align-items: flex-end; gap: 3px; margin-top: 22px; padding: 0 12px; }
    .plank-row::after { content: ""; position: absolute; right: 0; bottom: -13px; left: 0; height: 13px; border-radius: 3px; background: linear-gradient(#dccdb2, #b99f7c); box-shadow: 0 10px 16px rgb(80 60 30 / 16%); }
    .book { position: relative; flex: none; width: var(--w); height: var(--hh); padding: 0; border: 0; border-radius: 3px 3px 2px 2px; cursor: pointer; background: linear-gradient(90deg, color-mix(in srgb, var(--c) 72%, #000) 0, var(--c) 16%, color-mix(in srgb, var(--c) 78%, #fff) 44%, var(--c) 72%, color-mix(in srgb, var(--c) 70%, #000) 100%); box-shadow: inset 0 0 0 1px rgb(0 0 0 / 8%); transform: rotate(var(--tilt, 0deg)); transform-origin: bottom left; transition: transform .22s var(--ease), box-shadow .22s, opacity .3s, filter .3s; }
    .book:hover, .book:focus-visible { z-index: 3; outline: none; box-shadow: 0 16px 26px rgb(0 0 0 / 24%), inset 0 0 0 1px rgb(0 0 0 / 8%); transform: translateY(-14px) rotate(var(--tilt, 0deg)); }
    .book:focus-visible { box-shadow: 0 0 0 3px #1c7ed6, 0 16px 26px rgb(0 0 0 / 24%); }
    .book .bands { position: absolute; top: 8px; right: 4px; left: 4px; display: flex; gap: 1px; height: 4px; }
    .book .bands i { border-radius: 2px; }
    .book .rule { position: absolute; top: 18px; right: 3px; left: 3px; height: 1px; background: rgb(255 255 255 / 45%); }
    .book .t { position: absolute; top: 26px; bottom: 24px; left: 50%; overflow: hidden; color: #fff; font-size: 11px; font-weight: 700; letter-spacing: .01em; text-overflow: ellipsis; text-shadow: 0 1px 2px rgb(0 0 0 / 35%); white-space: nowrap; transform: translateX(-50%) rotate(180deg); writing-mode: vertical-rl; }
    .book .v { position: absolute; right: 0; bottom: 6px; left: 0; color: rgb(255 255 255 / 88%); font-size: 9px; font-weight: 800; text-align: center; }
    .book .flag { position: absolute; top: -7px; right: -4px; display: grid; width: 16px; height: 16px; place-items: center; border-radius: 50%; background: #ffd43b; color: #5c4400; font-size: 10px; font-weight: 900; box-shadow: 0 2px 4px rgb(0 0 0 / 20%); }
    .book.deprecated { --tilt: 7deg; opacity: .6; filter: grayscale(.55); }
    .book.mcp { background-image: repeating-linear-gradient(45deg, transparent 0 6px, rgb(255 255 255 / 20%) 6px 12px), linear-gradient(90deg, color-mix(in srgb, var(--c) 72%, #000), var(--c) 30%, var(--c) 70%, color-mix(in srgb, var(--c) 70%, #000)); }
    .book.skill { background-image: radial-gradient(rgb(255 255 255 / 30%) 1.2px, transparent 1.4px), linear-gradient(90deg, color-mix(in srgb, var(--c) 72%, #000), var(--c) 30%, var(--c) 70%, color-mix(in srgb, var(--c) 70%, #000)); background-size: 7px 7px, auto; }
    .book.agent { border-radius: 14px 14px 3px 3px; }
    .book.match { box-shadow: 0 0 0 3px #ffd43b, inset 0 0 0 1px rgb(0 0 0 / 8%); }
    .book.dim { opacity: .22; filter: grayscale(.8); }
    .book.related { box-shadow: 0 0 0 3px var(--rc); }
    .book .lux { position: absolute; right: 0; bottom: 18px; left: 0; color: #ffe066; font-size: 11px; text-align: center; text-shadow: 0 1px 2px rgb(0 0 0 / 40%); }
    .book .sdot { position: absolute; top: -5px; left: -3px; width: 10px; height: 10px; border: 2px solid #fff; border-radius: 50%; }
    .rayon { margin-top: 10px; padding: 8px 10px 16px; border-radius: 14px; transition: background .4s, box-shadow .4s; }
    .rayon + .rayon { margin-top: 18px; }
    .rayon.solo { margin-top: 0; padding-top: 0; }
    .rayon.solo .rayon-head { display: none; }
    .rayon.focus { background: color-mix(in srgb, var(--c) 9%, transparent); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--c) 45%, transparent); }
    .rayon-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin: 0 4px 2px; font-size: 15px; }
    .rayon-head span:last-child { color: var(--muted); font-size: 12px; }
    .rayon-head .dom-dot { align-self: center; }
    .rayon .plank-row:first-of-type { margin-top: 12px; }
    .shelf-empty { display: grid; height: 70%; place-items: center; color: var(--muted); text-align: center; }

    .tip { position: fixed; z-index: 70; display: none; max-width: 300px; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 12px; background: #fff; box-shadow: 0 12px 30px rgb(0 0 0 / 18%); pointer-events: none; font-size: 12px; line-height: 1.45; }
    .tip.show { display: block; }
    .tip b { display: block; font-size: 13.5px; }
    .tip .mut { color: var(--muted); }
    .tip .methods { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 5px; }

    /* ---------- Livre ouvert ---------- */
    .book-overlay { position: fixed; inset: 0; z-index: 80; display: none; place-items: center; background: rgb(24 20 14 / 55%); backdrop-filter: blur(5px); }
    .book-overlay.open { display: grid; }
    .tome { position: relative; display: grid; grid-template-columns: 1fr 1fr; width: min(1120px, 92vw); height: min(690px, 86vh); perspective: 2400px; }
    .tome::before { content: ""; position: absolute; inset: -11px -11px -13px; z-index: -1; border-radius: 18px; background: linear-gradient(90deg, color-mix(in srgb, var(--c) 75%, #000), var(--c) 48%, color-mix(in srgb, var(--c) 70%, #000) 50%, var(--c) 52%, color-mix(in srgb, var(--c) 75%, #000)); box-shadow: 0 34px 90px rgb(0 0 0 / 45%); }
    .page { position: relative; overflow: auto; padding: 32px 36px 44px; background: #fffdf7; }
    .page.left { border-radius: 12px 0 0 12px; box-shadow: inset -26px 0 30px -26px rgb(0 0 0 / 28%); transform-origin: right center; }
    .page.right { border-radius: 0 12px 12px 0; box-shadow: inset 26px 0 30px -26px rgb(0 0 0 / 28%); transform-origin: left center; }
    .right-inner { transform-origin: left center; }
    .folio { position: sticky; top: 100%; margin-top: 18px; color: var(--muted); font-size: 11px; font-style: italic; text-align: center; }
    .tome-full { position: absolute; top: -48px; right: 110px; padding: 8px 14px; border: 0; border-radius: 999px; background: #fff; cursor: pointer; font-weight: 700; }
    .book-overlay.full .tome { width: 100vw; height: 100vh; }
    .book-overlay.full .tome::before { inset: 0; border-radius: 0; }
    .book-overlay.full .page.left { border-radius: 0; }
    .book-overlay.full .page.right { border-radius: 0; }
    .book-overlay.full .tome-close, .book-overlay.full .tome-full { top: 12px; z-index: 3; box-shadow: 0 4px 14px rgb(0 0 0 / 20%); }
    .book-overlay.full .tome-close { right: 16px; } .book-overlay.full .tome-full { right: 126px; }
    .book-overlay.full .tome-nav.prev { left: 10px; } .book-overlay.full .tome-nav.next { right: 10px; }
    .tome-close { position: absolute; top: -48px; right: 0; padding: 8px 14px; border: 0; border-radius: 999px; background: #fff; cursor: pointer; font-weight: 700; }
    .tome-nav { position: absolute; top: 50%; display: grid; width: 44px; height: 44px; place-items: center; border: 0; border-radius: 50%; background: #fff; box-shadow: 0 8px 20px rgb(0 0 0 / 25%); cursor: pointer; font-size: 22px; transform: translateY(-50%); }
    .tome-nav.prev { left: -66px; } .tome-nav.next { right: -66px; }
    .tome-nav:disabled { opacity: .35; cursor: default; }
    .pg-kicker { color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .pg-kicker button { padding: 0; border: 0; background: none; color: inherit; cursor: pointer; font: inherit; letter-spacing: inherit; text-decoration: underline; text-decoration-color: var(--rule); text-transform: inherit; }
    .pg-title { margin: 8px 0 6px; font-family: Georgia, "Times New Roman", serif; font-size: 32px; font-weight: 700; letter-spacing: -.01em; line-height: 1.1; }

    /* =====================================================================
       MOSAÏQUE — une tuile par entité, ses pôles à l’intérieur, un pôle = une étagère d’API

    const ROOT = "root";
    function nodeOf(k) {

    const usageMode = () => state.metric === "usage" && state.type === "api";
    const appValue = (aid) => (usageMode() ? APPS[aid].apis.reduce((s, a) => s + a.calls, 0) : itemsOf(aid).length);
    const nodeValue = (k) => appsUnder(k).reduce((s, a) => s + appValue(a), 0);
    const nodeCount = (k) => appsUnder(k).reduce((s, a) => s + itemsOf(a).length, 0);
    const typeWord = (n) => ({ api: "API", mcp: "MCP", skill: n > 1 ? "skills" : "skill", agent: n > 1 ? "agents" : "agent" }[state.type]);

    function squarify(items, x, y, w, hgt) {
      const out = [], total = items.reduce((s, i) => s + i.value, 0);

      let row = [];
      const worst = (r, side) => { const s = r.reduce((a, b) => a + b.area, 0); let mx = -Infinity, mn = Infinity; r.forEach((i) => { mx = Math.max(mx, i.area); mn = Math.min(mn, i.area); }); return Math.max((side * side * mx) / (s * s), (s * s) / (side * side * mn)); };

    const mosaic = $("#mosaic"), layer = $("#layer"), links = $("#links"), shelfM = $("#shelf-m");
    const GAP = 6;

    function renderMosaic() {

    function tileEl(r) {

      const head = h(`<button class="tile-head" type="button"><span style="min-width:0"><div class="tile-name">${esc(n.name)}</div><div class="tile-meta">${esc(meta)}</div>${n.kind !== "a" && !compact ? `<div class="tile-meta" style="opacity:.8">${esc(n.sub)}</div>` : ""}</span><span class="tile-badges"></span></button>`);

    }
    // Aperçu de l'étagère : une barre par API (épaisseur = endpoints, hauteur = usage)
    const LOGMAX = Math.log10(Math.max(...APIS.map((a) => a.calls)));

    /* ---------- Zoom animé entre niveaux ---------- */

    /* ---------- Mises en évidence : recherche & relations ---------- */
    const qNorm = () => norm(state.query.trim());
    const apiMatches = (it) => { const q = qNorm(); return q.length >= 2 && norm(`${it.name} ${APPS[it.app].name} ${it.endpoints.map((e) => e[1]).join(" ")}`).includes(q); };
    function relSets() {

      const center = (el) => { const r = relRect(el); return [r.x + r.w / 2, r.y + r.h / 2]; };

        const [x1, y1] = center(from), [x2, y2] = center(to), dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1, bend = Math.min(80, len * .22);

    /* ---------- Étagère : un livre = une API ---------- */

    function renderShelf(host, k) {
      const n = nodeOf(k), e = ENT[APPS[n.id].entity], apps = shelfApps(k), apis = apps.flatMap((aid) => APPS[aid].apis);

      });
      if (state.api && ITEM[state.api]) {
        nav.append(h(`<span class="crumb-sep" aria-hidden="true">›</span>`));
        nav.append(h(`<button class="crumb current" type="button" aria-current="location"><span class="crumb-level">${ITEM[state.api].type === "api" ? "API" : TYPES.find((t) => t.id === ITEM[state.api].type).label}</span>${esc(ITEM[state.api].name)}</button>`));
      }
    }
    function renderSummary() {
      const k = currentKey(), n = nodeOf(k), apps = appsUnder(k), apis = apps.flatMap((a) => APPS[a].apis);
      const eps = apis.reduce((s, a) => s + a.endpoints.length, 0), calls = apis.reduce((s, a) => s + a.calls, 0), comp = Math.round(apis.reduce((s, a) => s + a.score, 0) / (apis.length || 1));
      const lux = apis.filter((a) => a.score === 100).length, ai = ["mcp", "skill", "agent"].map((t) => [t, apps.reduce((s, a) => s + APPS[a].items[t].length, 0)]);
      $("#summary").innerHTML = `<h1>${esc(n.name)}</h1><div class="facts">
        ${n.kind === "root" ? `<span><b>${ENTITIES.length}</b> entités</span>` : ""}<span><b>${apps.length}</b> pôle${apps.length > 1 ? "s" : ""}</span><span><b>${apis.length}</b> API</span><span><b>${fmt(eps)}</b> endpoints</span>
        <span><b>${fmt(calls)}</b> appels/j</span><span><b>${comp} %</b> conformité</span><span><b>${lux}</b> ★</span>${ai.map(([t, v]) => (v ? `<span><b>${v}</b> ${t === "api" ? "API" : t === "mcp" ? "MCP" : t === "skill" ? "skills" : "agents"}</span>` : "")).join("")}</div>`;
    }
    function renderTypes() {
      const box = $("#types");
      box.replaceChildren();
      TYPES.forEach((t) => {
        const b = h(`<button type="button" class="${state.type === t.id ? "on" : ""}" aria-pressed="${state.type === t.id}">${t.label}<small>${typeCount(t.id)}</small></button>`);
        b.addEventListener("click", () => { if (state.type === t.id) return; state.type = t.id; renderTypes(); renderMetric(); if (state.view === "mosaic") { closeBook(false); renderMosaic(); enterAnim(); } else refreshCity(); });
        box.append(b);
      });
    }
    function renderMetric() {
      const box = $("#metric");
      box.replaceChildren();
      [["count", "Nombre"], ["usage", "Usage"]].forEach(([id, label]) => {
        const on = id === "usage" ? usageMode() : !usageMode(), disabled = id === "usage" && state.type !== "api";
        const b = h(`<button type="button" class="${on ? "on" : ""}" aria-pressed="${on}" ${disabled ? `disabled title="Volume d’appels disponible pour les API uniquement"` : ""}>${label}</button>`);
        b.addEventListener("click", () => { state.metric = id; renderMetric(); renderMosaic(); enterAnim(); });
        box.append(b);
      });
    }

    /* ---------- Barre des relations (les deux vues) ---------- */
    function setRel(id) { state.rel = id; renderRelbar(); if (state.view === "mosaic") renderMosaic(); syncHash(); }
    function clearRel() {
      state.rel = null;
      drawNet(); renderRelbar(); refreshCity();
      if (state.view === "mosaic") renderMosaic();
      syncHash();
    }
    function renderRelbar() {
      const bar = $("#relbar");
      $("#stage").classList.toggle("rel-open", Boolean(state.rel));
      if (!state.rel) { bar.classList.remove("open"); bar.replaceChildren(); return; }
      const it = ITEM[state.rel], cons = consumersOf(it.id), imp = impactOfApi(it.id);
      bar.innerHTML = `<span class="bar-title">Relations de « ${esc(it.name)} »</span>
        <div class="rel-legend"><span><i style="background:#1c7ed6"></i>Dépend de <b>${it.deps.length}</b></span><span><i style="background:#e8590c"></i>Consommée par <b>${cons.length}</b>${it.ext.length ? ` + ${it.ext.length} ext.` : ""}</span><span><i style="background:#9c36b5"></i>Événements <b>${eventSubscribersOf(it.id).length}</b></span><span>· si elle tombe : <b>${imp.apis}</b> API, <b>${imp.apps}</b> pôles impactés</span></div>
        ${state.view === "city" ? `<div class="net-switch" role="group" aria-label="Style du réseau"><button type="button" data-n="water" class="${state.net === "water" ? "on" : ""}">💧 Canalisations</button><button type="button" data-n="metro" class="${state.net === "metro" ? "on" : ""}">🚇 Métro</button></div>` : ""}
        <button class="btn ghost" type="button" data-open-fiche>Ouvrir la fiche</button><button class="btn" type="button" data-quit>Quitter</button>`;
      bar.classList.add("open");
      bar.querySelectorAll("[data-n]").forEach((b) => b.addEventListener("click", () => { state.net = b.dataset.n; drawNet(); renderRelbar(); syncHash(); }));
      bar.querySelector("[data-open-fiche]").addEventListener("click", () => openFromAnywhere(it.id));
      bar.querySelector("[data-quit]").addEventListener("click", clearRel);
    }
    function openFromAnywhere(id) {
      const it = ITEM[id];
      if (state.view === "city" && it.type === "api") { selectApi(id, "fiche"); return; }
      if (state.view === "city") setView("mosaic", { push: false });
      if (currentKey() !== containerOf(it.app)) navigate(pathOf(`a:${it.app}`), { quiet: true });
      openBook(id);
    }

    /* ---------- Recherche ---------- */
    const q = $("#q"), results = $("#results");
    let resIndex = -1, resActions = [];
    function search(text) {
      const t = norm(text.trim());
      if (t.length < 2) return [];
      const out = [];
      ENTITIES.filter((e) => norm(`${e.name} ${e.role}`).includes(t)).forEach((e) => out.push({ group: "Entités", icon: "E", title: e.name, path: `${e.role} · ${e.apps.length} pôles`, act: () => navigate([`e:${e.id}`]) }));
      Object.values(SUBS).filter((s) => norm(s.name).includes(t)).forEach((s) => out.push({ group: "Quartiers (sous-entités)", icon: "Q", title: s.name, path: ENT[s.entity].name, act: () => navigate(pathOf(`s:${s.id}`)) }));
      APP_LIST.filter((a) => norm(a.name).includes(t)).slice(0, 8).forEach((a) => out.push({ group: "Pôles", icon: "P", c: DOMAINS[a.domain].color, title: a.name, path: `${wherePath(a.apis[0]).split(" › ").slice(0, -1).join(" › ")} · ${a.apis.length} API`, act: () => { state.focusApp = a.id; if (state.view === "mosaic") closeBook(false); navigate(pathOf(`a:${a.id}`)); } }));
      TYPES.forEach((type) => {
        const found = APP_LIST.flatMap((a) => itemsOf(a.id, type.id)).filter((it) => norm(`${it.name} ${APPS[it.app].name} ${it.endpoints.map((e) => e[1]).join(" ")}`).includes(t));
        found.slice(0, 7).forEach((it) => out.push({ group: `${type.label} · ${found.length}`, icon: type.id === "api" ? "{}" : TYPE_MARK[type.id], c: colorOf(it), title: it.name, path: `${wherePath(it)} · ${it.endpoints[0][1]}`, act: () => { if (state.type !== it.type) { state.type = it.type; renderTypes(); renderMetric(); } openFromAnywhere(it.id); } }));
      });
      return out;
    }
    function renderResults() {
      const list = search(q.value);
      resActions = list.map((r) => r.act);
      results.replaceChildren();
      if (q.value.trim().length < 2) { results.classList.remove("open"); return; }
      if (!list.length) results.append(h(`<div class="res-empty">Rien pour « ${esc(q.value.trim())} ». Essayez « virement », « Oney », « KYC », « Natixis »…</div>`));
      let group = null;
      list.forEach((r, i) => {
        if (r.group !== group) { group = r.group; results.append(h(`<div class="res-group">${esc(group)}</div>`)); }
        const b = h(`<button class="res-item${i === resIndex ? " active" : ""}" type="button" role="option"><span class="res-icon" style="${r.c ? `--c:${r.c}` : ""}">${esc(r.icon)}</span><span class="res-main"><div class="res-title">${esc(r.title)}</div><div class="res-path">${esc(r.path)}</div></span></button>`);
        b.addEventListener("mousedown", (e) => e.preventDefault());
        b.addEventListener("click", () => choose(i));
        results.append(b);
      });
      results.classList.add("open");
    }
    function choose(i) { results.classList.remove("open"); q.blur(); resActions[i]?.(); }
    function applySearch() { if (state.view === "mosaic") { applyMosaicHighlights(); highlightBooks(); } else refreshCity(); }
    q.addEventListener("input", () => { state.query = q.value; resIndex = -1; renderResults(); applySearch(); });
    q.addEventListener("focus", renderResults);
    q.addEventListener("blur", () => setTimeout(() => results.classList.remove("open"), 120));
    q.addEventListener("keydown", (e) => {
      const items = [...results.querySelectorAll(".res-item")];
      if (e.key === "ArrowDown") { e.preventDefault(); resIndex = Math.min(items.length - 1, resIndex + 1); }
      else if (e.key === "ArrowUp") { e.preventDefault(); resIndex = Math.max(0, resIndex - 1); }
      else if (e.key === "Enter") { e.preventDefault(); choose(Math.max(0, resIndex)); return; }
      else if (e.key === "Escape") { q.value = ""; state.query = ""; renderResults(); applySearch(); q.blur(); return; }
      else return;
      items.forEach((it, i) => it.classList.toggle("active", i === resIndex));
      items[resIndex]?.scrollIntoView({ block: "nearest" });
    });
    document.addEventListener("keydown", (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); q.focus(); q.select(); return; }
      if (document.activeElement === q || /^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName)) return;
      if (bookOv.classList.contains("open")) {
        if (e.key === "Escape") closeBook(); else if (e.key === "ArrowRight") turn(1); else if (e.key === "ArrowLeft") turn(-1);
        return;
      }
      if (e.key !== "Escape") return;
      if (side.classList.contains("full") && state.view === "city") toggleSideFull(false);
      else if (side.classList.contains("open") && state.view === "city") closeSide();
      else if (state.rel) clearRel();
      else if (state.path.length) { if (state.view === "mosaic") zoomOutTo(state.path.slice(0, -1)); else navigate(state.path.slice(0, -1)); }
    });

    /* ---------- Adresse partageable : #/vue/e:…/s:…/a:…/api:…/onglet:…/reseau:… ---------- */
    function hashFor() {
      return `#/${state.view === "city" ? "cite" : "mosaique"}${state.path.map((k) => `/${k}`).join("")}${state.api ? `/api:${state.api}` : ""}${state.api && state.view === "city" && state.tab !== "fiche" ? `/onglet:${state.tab}` : ""}${state.rel ? `/reseau:${state.rel}:${state.net}` : ""}`;
    }
    function syncHash() { const hsh = hashFor(); if (location.hash !== hsh) history.pushState(null, "", hsh); }
    function parseHash() {
      const seg = decodeURIComponent(location.hash).replace(/^#\/?/, "").split("/").filter(Boolean);
      const out = { view: seg[0] === "cite" ? "city" : "mosaic", path: [], api: null, tab: "fiche", rel: null, net: "water" };
      seg.slice(1).forEach((x) => {
        if (/^[esa]:/.test(x) && nodeOfSafe(x)) out.path.push(x);
        else if (x.startsWith("api:") && ITEM[x.slice(4)]) out.api = x.slice(4);
        else if (x.startsWith("onglet:")) out.tab = x.slice(7);
        else if (x.startsWith("reseau:")) { const [, id, net] = x.split(":"); if (ITEM[id]) { out.rel = id; out.net = net === "metro" ? "metro" : "water"; } }
      });
      if (out.path.length) { const last = out.path.at(-1); out.path = pathOf(last); }
      if (out.api) out.path = pathOf(`a:${ITEM[out.api].app}`);
      return out;
    }
    const nodeOfSafe = (k) => { const id = k.slice(2); return k[0] === "e" ? ENT[id] : k[0] === "s" ? SUBS[id] : APPS[id]; };
    function applyHash() {
      const st = parseHash();
      state.tab = st.tab; state.rel = st.rel; state.net = st.net;
      closeBook(false);
      if (state.view !== st.view || !cityReady) { state.path = st.path; state.api = st.view === "city" ? st.api : null; setView(st.view, { push: false }); }
      if (st.view === "mosaic") {
        navigate(st.path, { push: false });
        if (st.api) openBook(st.api, { push: false });
        renderRelbar(); applyMosaicHighlights();
      } else {
        drawNet(); renderRelbar();
        if (st.api) selectApi(st.api, st.tab, { push: false, move: !st.rel });
        else { closeSide({ push: false }); navigate(st.path, { push: false }); }
        if (st.rel) setNet(st.rel, st.net);
      }
    }
    window.addEventListener("popstate", applyHash);

    /* ---------- Démarrage ---------- */
    drawCity(); applyM();
    view = fitScreen(screenBox({ x: -6, y: -6, w: WORLD.w + 12, h: WORLD.h + 12 }, M_FLAT, false), 10);
    applyCam(); layoutScreen();
    renderTypes(); renderMetric();
    {
      const st = parseHash();
      state.path = st.path; state.rel = st.rel; state.net = st.net; state.tab = st.tab;
      state.view = st.view === "city" ? "mosaic" : "city"; // force l'initialisation complète
      if (st.view === "city") { state.api = st.api; cityReady = true; state.view = "mosaic"; setView("city", { push: false }); }
      else { cityReady = true; setView("mosaic", { push: false }); if (st.api) openBook(st.api, { push: false }); }
      renderRelbar();
      history.replaceState(null, "", hashFor());
    }
    requestAnimationFrame(moveCars);
    let resizeT = 0, lastSize = "";
    new ResizeObserver(() => {
      const sz = `${$("#stage").clientWidth}x${$("#stage").clientHeight}`;
      if (sz === lastSize) return;
      const first = !lastSize;
      lastSize = sz;
      if (first) return;
      clearTimeout(resizeT);
      resizeT = setTimeout(() => {
        if (state.view === "mosaic") renderMosaic();
        else { stopCam(); if (state.rel) fitNet(1); else if (state.api) cityFocusOn(`a:${ITEM[state.api].app}`, { ms: 1 }); else cityFocusOn(currentKey(), { ms: 1 }); }
      }, 120);
    }).observe($("#stage"));
  </script>
</body>
</html>
